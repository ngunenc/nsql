# Yalnızca geliştirme ortamı. Web kökü docker/public: proje kökündeki .env, storage/keys,
# storage/logs ve tests/*.php dışarıdan erişilemez.
server {
    listen 80;
    server_name localhost;
    root /var/www/html/docker/public;
    index index.php;

    # Gizli dosyalar (.env, .git, .htaccess …)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Monitoring: uygulama katmanında NSQL_MONITORING_TOKEN zorunlu (examples/monitoring/health.php, metrics.php).
    # İsteğe bağlı ek kısıt: allow/deny veya auth_basic ile IP/ağ sınırlaması.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
