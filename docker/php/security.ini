; nsql geliştirme imajı için PHP sertleştirme ayarları
; session.upload_progress: PHP2Shell (CVE-2026-109619) ve CVE-2026-115560 için önerilen azaltım;
; kütüphane yükleme ilerlemesini kullanmaz. Yamalı PHP'de de kapalı kalması önerilir.
session.upload_progress.enabled = 0
; Yanıt başlığında PHP sürümünü göstermez (X-Powered-By)
expose_php = Off
