name: CI

on:
  push:
    branches: [ main, develop, 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nsql_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: nsql_test_db
      DB_USER: root
      DB_PASS: root
      ENV: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis, memcached
          coverage: ${{ matrix.php == '8.3' && 'xdebug' || 'none' }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create test database
        run: mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS nsql_test_db;"

      - name: Run PHPUnit tests
        if: matrix.php != '8.3'
        run: composer test

      - name: Run PHPUnit with coverage
        if: matrix.php == '8.3'
        run: composer test:coverage
        env:
          XDEBUG_MODE: coverage

      - name: Enforce minimum line coverage (65%)
        if: matrix.php == '8.3'
        run: php tests/coverage_check.php coverage/clover.xml 65 --lowest=10

      - name: Run integration tests with query cache enabled
        run: composer test:cache

      - name: Run PHPStan
        run: composer stan

      - name: Run CodeSniffer
        run: composer lint

      - name: Upload coverage to Codecov
        if: matrix.php == '8.3'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/clover.xml
          flags: unittests
          name: codecov-nsql
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Sürücüden bağımsız testler (tests/Portable) PostgreSQL ve SQLite üzerinde; MySQL'de test job'ı koşturur
  portable:
    name: Portable (${{ matrix.driver }}, PHP 8.3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: ['pgsql', 'sqlite']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nsql_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: testing
      DB_DRIVER: ${{ matrix.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: nsql_test_db
      DB_USER: postgres
      DB_PASS: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run portable tests
        run: vendor/bin/phpunit -c phpunit.xml --testsuite portable

      - name: Run portable tests with query cache enabled
        run: vendor/bin/phpunit -c phpunit.xml --testsuite portable
        env:
          NSQL_TEST_QUERY_CACHE: '1'

  # Ana gate değil: MySQL service yok; yalnızca unit suite (SQLite/env bağımsız testler)
  windows-smoke:
    name: Windows unit smoke (PHP 8.3)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit -c phpunit.xml --testsuite unit
        env:
          ENV: testing
          DB_DRIVER: sqlite
