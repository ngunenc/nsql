openapi: 3.0.3
info:
  title: nsql Monitoring Endpoints
  description: |
    nsql bir PHP kütüphanesidir; HTTP API sunmaz. Bu şema yalnızca
    `examples/monitoring/health.php` ve `examples/monitoring/metrics.php`
    örnek endpoint'lerini tanımlar (`nsql\database\monitoring\health_check`,
    `metrics` ve `endpoint_guard`).

    Kimlik doğrulama: `Authorization: Bearer <token>` veya `X-NSQL-Monitoring-Token`
    başlığı. Token `NSQL_MONITORING_TOKEN` ile tanımlanır; tanımlı değilse 403 döner.
    `?token=` sorgu parametresi yalnızca `NSQL_MONITORING_ALLOW_QUERY_TOKEN=true` iken kabul edilir.
    `NSQL_MONITORING_ENABLED=false` endpoint'leri kapatır (404).
  version: 1.13.3
  license:
    name: MIT
    url: https://github.com/ngunenc/nsql/blob/main/LICENSE

servers:
  - url: http://localhost
    description: Örnek dosyaları sunan web sunucusu

security:
  - bearerAuth: []
  - monitoringToken: []

paths:
  /health.php:
    get:
      summary: Sağlık kontrolü
      description: Veritabanı (`SELECT 1`), query cache ve bellek durumunu raporlar.
      responses:
        '200':
          description: Sağlıklı veya kısmi bozulma (degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: Veritabanı erişilemez (unhealthy) veya beklenmeyen hata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HealthReport'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TokenNotConfigured'
        '404':
          $ref: '#/components/responses/Disabled'

  /metrics.php:
    get:
      summary: Çalışma zamanı metrikleri
      responses:
        '200':
          description: Metrikler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '500':
          description: Beklenmeyen hata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TokenNotConfigured'
        '404':
          $ref: '#/components/responses/Disabled'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    monitoringToken:
      type: apiKey
      in: header
      name: X-NSQL-Monitoring-Token

  responses:
    Unauthorized:
      description: Token eksik veya hatalı
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TokenNotConfigured:
      description: NSQL_MONITORING_TOKEN tanımlı değil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Disabled:
      description: NSQL_MONITORING_ENABLED=false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Unauthorized
        timestamp:
          type: string
          example: '2026-10-05 12:00:00'

    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                response_time:
                  type: string
                  example: 1.2ms
                message:
                  type: string
            cache:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, disabled, unhealthy]
                enabled:
                  type: boolean
                hit_rate:
                  type: string
                  example: 85%
                size:
                  type: integer
                message:
                  type: string
            memory:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, warning, critical, unknown]
                current_usage:
                  type: string
                peak_usage:
                  type: string
                limit:
                  type: string
                usage_percent:
                  type: string
                message:
                  type: string

    Metrics:
      type: object
      properties:
        database:
          type: object
          additionalProperties: true
        cache:
          type: object
          properties:
            enabled:
              type: boolean
            size:
              type: integer
            limit:
              type: integer
            hits:
              type: integer
            misses:
              type: integer
            hit_rate:
              type: string
            timeout:
              type: integer
        memory:
          type: object
          properties:
            current_usage:
              type: integer
            peak_usage:
              type: integer
            limit:
              type: integer
            usage_percent:
              type: number
        connection_pool:
          type: object
          properties:
            active_connections:
              type: integer
            idle_connections:
              type: integer
            total_connections:
              type: integer
            max_connections:
              type: integer
        query_analyzer:
          type: object
          properties:
            total_queries:
              type: integer
            slow_queries:
              type: integer
            risky_queries:
              type: integer
            average_execution_time:
              type: number
        timestamp:
          type: string
